syntax = "proto3";
package GymLifeRpg.Ui.Models.SessionHistoryDao;

import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "proto/SessionBlueprintDao/SessionBlueprintDaoV2.proto";
import "proto/Utils.proto";

message SessionHistoryDaoV2 {
  repeated SessionDaoV2 completed_sessions = 1;
}

message SessionDaoV2 {
  GymLifeRpg.Ui.Models.UuidDao               id                 = 1;
  string                                  session_name       = 2;
  repeated RecordedExerciseDaoV2          recorded_exercises = 3;
  GymLifeRpg.Ui.Models.DateOnlyDao           date               = 4;
  optional GymLifeRpg.Ui.Models.DecimalValue bodyweight_value   = 5;
  GymLifeRpg.Ui.Models.WeightUnit            bodyweight_unit    = 7;
  string                                  blueprint_notes    = 6;
}

message RecordedExerciseDaoV2 {
  // Common
  GymLifeRpg.Ui.Models.SessionBlueprintDao.ExerciseBlueprintDaoV2 exercise_blueprint = 1;
  GymLifeRpg.Ui.Models.SessionBlueprintDao.ExerciseType           type               = 6;
  optional google.protobuf.StringValue                         notes              = 4;

  // Weighted
  reserved 2; // was weight
  repeated PotentialSetDaoV2 potential_sets = 3;
  reserved 5; // Per set weight

  // Cardio
  optional GymLifeRpg.Ui.Models.DateTimeDao  completion_date_time = 8;
  optional google.protobuf.Duration       duration             = 9;
  optional GymLifeRpg.Ui.Models.DecimalValue distance_value       = 10;
  optional google.protobuf.StringValue    distance_unit        = 14;
  optional GymLifeRpg.Ui.Models.DecimalValue resistance           = 11;
  optional GymLifeRpg.Ui.Models.DecimalValue incline              = 12;
}

message PotentialSetDaoV2 {
  optional RecordedSetDaoV2      recorded_set = 1;
  GymLifeRpg.Ui.Models.DecimalValue weight_value = 2;
  GymLifeRpg.Ui.Models.WeightUnit   weight_unit  = 3;
}

message RecordedSetDaoV2 {
  int32 reps_completed  = 1;

  GymLifeRpg.Ui.Models.TimeOnlyDao            completion_time = 2;
  optional GymLifeRpg.Ui.Models.DateOnlyDao   completion_date = 3;
  optional GymLifeRpg.Ui.Models.ZoneOffsetDao completion_offset = 4;
}
