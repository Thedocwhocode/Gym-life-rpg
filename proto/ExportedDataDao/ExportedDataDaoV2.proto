syntax = "proto3";
package GymLifeRpg.Ui.Models.ExportedDataDao;

import "google/protobuf/wrappers.proto";
import "proto/FeedStateDao.proto";
import "proto/ProgramBlueprintDao/ProgramBlueprintDaoV1.proto";
import "proto/SessionBlueprintDao/SessionBlueprintDaoV2.proto";
import "proto/SessionHistoryDao/SessionHistoryDaoV2.proto";

message ExportedDataDaoV2 {
  repeated GymLifeRpg.Ui.Models.SessionHistoryDao.SessionDaoV2                sessions          = 1;
  repeated GymLifeRpg.Ui.Models.SessionBlueprintDao.SessionBlueprintDaoV2     program           = 2;
  map<string, GymLifeRpg.Ui.Models.ProgramBlueprintDao.ProgramBlueprintDaoV1> saved_programs    = 3;
  google.protobuf.StringValue                                              active_program_id = 4;
  GymLifeRpg.Ui.Models.FeedStateDaoV1                                         feed_state        = 5;
  // Escolhas do RPG (store/choices) em JSON. XP, nível etc. são recalculados das sessões.
  google.protobuf.StringValue                                              choices_json      = 6;
}
